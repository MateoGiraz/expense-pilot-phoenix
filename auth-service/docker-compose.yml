version: '3.8'

services:
  auth-service:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@auth-db:5432/auth_service_db
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - PORT=5000
      - NODE_ENV=development
    depends_on:
      - auth-db
    restart: unless-stopped
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma

  auth-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=auth_service_db
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

volumes:
  auth_db_data: 