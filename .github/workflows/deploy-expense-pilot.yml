name: Deploy Expense Pilot (Phoenix App)

on:
  push:
    tags:
      - 'expense-pilot-*'

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: expense-pilot/expense-pilot
  ECS_CLUSTER: expense-pilot-cluster
  ECS_SERVICE: expense-pilot

jobs:
  deploy:
    name: Deploy Expense Pilot
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Create task definition
      run: |
        cat > task-definition.json << EOF
        {
          "family": "${{ env.ECS_SERVICE }}",
          "networkMode": "awsvpc",
          "requiresCompatibilities": ["FARGATE"],
          "cpu": "512",
          "memory": "1024",
          "executionRoleArn": "arn:aws:iam::170107269579:role/ecsTaskExecutionRole",
          "containerDefinitions": [
            {
              "name": "${{ env.ECS_SERVICE }}",
              "image": "${{ steps.build-image.outputs.image }}",
              "portMappings": [
                {
                  "containerPort": 4000,
                  "protocol": "tcp"
                }
              ],
              "environment": [
                {
                  "name": "DATABASE_URL",
                  "value": "${{ secrets.PHOENIX_DATABASE_URL }}"
                },
                {
                  "name": "API_GATEWAY_URL",
                  "value": "http://api-gateway.expense-pilot.local:8080"
                },
                {
                  "name": "PHX_HOST",
                  "value": "localhost"
                },
                {
                  "name": "SECRET_KEY_BASE",
                  "value": "${{ secrets.SECRET_KEY_BASE }}"
                },
                {
                  "name": "PHX_SERVER",
                  "value": "true"
                },
                {
                  "name": "AWS_ACCESS_KEY_ID",
                  "value": "${{ secrets.AWS_ACCESS_KEY_ID }}"
                },
                {
                  "name": "AWS_SECRET_ACCESS_KEY",
                  "value": "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
                },
                {
                  "name": "AWS_REGION",
                  "value": "us-east-1"
                },
                {
                  "name": "SQS_QUEUE_URL",
                  "value": "${{ secrets.SQS_QUEUE_URL }}"
                }
              ],
              "logConfiguration": {
                "logDriver": "awslogs",
                "options": {
                  "awslogs-group": "/ecs/${{ env.ECS_SERVICE }}",
                  "awslogs-region": "${{ env.AWS_REGION }}",
                  "awslogs-stream-prefix": "ecs"
                }
              }
            }
          ]
        }
        EOF

    - name: Deploy to Amazon ECS
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: task-definition.json
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        desired-count: 1
        wait-for-service-stability: true 